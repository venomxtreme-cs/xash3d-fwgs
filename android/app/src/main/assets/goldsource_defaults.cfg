// ======================================================================
//  goldsource_defaults.cfg - PC GoldSource graphics baseline (build 112)
//
//  Executed ONLY when <gamedir>/config.cfg does not exist (fresh install
//  or the user deleted it - report: "when i removed config.cfg and open
//  game it show graphics weird like from xash old, fix it do like pc
//  version goldsource"). When config.cfg is present it keeps winning and
//  this file is never read.
//
//  Values mirror the retail CS 1.6 look for every graphics knob the
//  engine/menu exposes (Video tab: gamma, brightness, overbright, detail
//  textures, water ripple, texture filtering, MSAA, VBO). Keep them in
//  step with the menu - this file is the single place to retune the
//  no-config picture, no rebuild needed (repackage the APK though).
// ======================================================================

// --- picture: retail GoldSource grade ---------------------------------
gamma 2.200000
brightness 0.000000

// rendering mix: the retail feel (overbright + detail textures on,
// software-era ripple OFF - the old-Xash wavy water is what "looks like
// xash old"), the modern quality conveyors on, glitchy paths off
gl_overbright 1
r_detailtextures 1
r_ripple 0
gl_texture_nearest 0
gl_msaa 1
gl_vbo 0

// full screen view (retail always renders the whole frame)
viewsize 120

// A7 tuned graphics defaults that are archived too - a reset config
// must not revert them either
ui_renderworld 1
cl_advertise_engine_in_name 0